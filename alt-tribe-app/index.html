<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alt.Tribe — Curated, different and eclectic</title>
    <meta
      name="description"
      content="Alt.Tribe is a curated store of 100+ independent Indian brands in M Block Market, Greater Kailash II, New Delhi — clothing, jewellery, home, skincare, wellness, bags, edibles and more."
    />
    <meta name="theme-color" content="#b74d79" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alt.Tribe" />
    <meta property="og:title" content="Alt.Tribe — Curated, different and eclectic" />
    <meta
      property="og:description"
      content="100+ independent Indian brands under one roof in GK2, New Delhi. You build the brand. We handle the retail."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Loading screen: inline so it paints before the bundle arrives. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: #ffffff;
        transition: opacity .5s ease, visibility .5s ease;
      }
      .boot__logo {
        width: clamp(120px, 22vw, 190px);
        height: auto;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: .55; transform: scale(.97); }
        50%      { opacity: 1;   transform: scale(1); }
      }
      .boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .boot__logo { animation: none; opacity: 1; transform: none; }
        .boot { transition: opacity .01s linear, visibility .01s linear; }
      }
    </style>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Alt.Tribe","alternateName":"Alt Tribe","url":"https://alt-tribe.in/"}
    </script>
    <link rel="canonical" href="https://alt-tribe.in/" />
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-label="Loading Alt.Tribe">
      <img class="boot__logo" src="/Alt Logo.avif" alt="" fetchpriority="high" />
    </div>
    <noscript><style>.boot { display: none; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
